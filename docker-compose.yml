services:
  oxm-vision:
    build: .
    image: oxm-vision:latest
    runtime: nvidia
    privileged: true
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    devices:
      # Ajustar según `v4l2-ctl --list-devices` (los números cambian al reconectar)
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/snd:/dev/snd
    volumes:
      - /dev/v4l:/dev/v4l:ro

      # Modelos YOLO (.engine compilado en ESTA Jetson; no es portable)
      - ${YOLO_DIR:-./yolo}:/yolo:ro

      # Datos runtime (persisten entre rebuilds). Crear antes con `touch` los archivos.
      - ${DATA_DIR:-./data}/audio_clips:/app/audio_clips
      - ${DATA_DIR:-./data}/events.db:/app/events.db
      - ${DATA_DIR:-./data}/events.db-shm:/app/events.db-shm
      - ${DATA_DIR:-./data}/events.db-wal:/app/events.db-wal
      - ${DATA_DIR:-./data}/face_snaps:/app/face_snaps
      - ${DATA_DIR:-./data}/face_db.pkl:/app/face_db.pkl

      # Socket de NVIDIA Argus (cámara CSI)
      - /tmp/argus_socket:/tmp/argus_socket

      # Código fuente (editable sin rebuild)
      - ./src/main.py:/app/main.py
      - ./src/dashboard.py:/app/dashboard.py
      - ./src/face_reid.py:/app/face_reid.py
      - ./src/pose.py:/app/pose.py
      - ./src/db.py:/app/db.py
      - ./src/csi_worker.py:/app/csi_worker.py

      # Assets
      - ./assets/logo-oxmtech.png:/app/logo-oxmtech.png
      - ./assets/chart.umd.min.js:/app/chart.umd.min.js
      - ./assets/yamnet.tflite:/app/yamnet.tflite
      - ./assets/yamnet_labels.txt:/app/yamnet_labels.txt

      # Libs del host (GStreamer + NVIDIA en JetPack)
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0:/usr/lib/aarch64-linux-gnu/gstreamer-1.0
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/host-nvidia

      # Modelos InsightFace y cache de Whisper/HuggingFace
      - ${INSIGHTFACE_DIR:-./models/insightface}:/root/.insightface
      - ${WHISPER_CACHE:-./models/whisper_cache}:/root/.cache/huggingface
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=
      - EGL_PLATFORM=surfaceless
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/host-nvidia:/usr/lib/aarch64-linux-gnu/nvidia
      - "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}"
      - "TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}"
      - "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}"
      - "REPORT_HOUR_CST=${REPORT_HOUR_CST:-8}"
      - "NEMOTRON_URL=${NEMOTRON_URL:-http://localhost:8003/v1}"
    command: bash -c "sleep 5 && python3 main.py"
